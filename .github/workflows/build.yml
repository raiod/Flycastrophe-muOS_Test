name: Build Flycastrophe for Brick (experimental)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            cmake \
            ninja-build \
            pkg-config \
            libgles2-mesa-dev

      - name: Compile and inspect
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee build.log
        shell: bash

      - name: Upload core
        uses: actions/upload-artifact@v4
        with:
          name: flycastrophe-brick-experimental
          path: dist/
          if-no-files-found: error

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
